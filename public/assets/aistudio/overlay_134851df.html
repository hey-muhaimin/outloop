<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outloop — Pause Overlay</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* Simulated underlying short-form video feed */
    .overlay-viewport {
      padding: 0;
      background: #1B1D1C;
    }
    .underlying-feed {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 75% 22%, rgba(251, 185, 122, 0.22), transparent 45%),
        radial-gradient(circle at 22% 72%, rgba(93, 196, 184, 0.20), transparent 50%),
        linear-gradient(180deg, #242725 0%, #141514 100%);
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.35);
    }
    .feed-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }
    .feed-skeleton {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }
    .skel-line {
      height: 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Calm Transparent Dim Scrim */
    .dim-scrim {
      position: relative;
      z-index: 2;
      flex: 1;
      background: rgba(18, 19, 18, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 36px 22px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .overlay-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-pill {
      background: rgba(255, 255, 255, 0.10);
      color: var(--text-on-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 99px;
    }
    .budget-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-mint);
    }

    /* Center Breathing / Pause Gauge */
    .center-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .breath-ring {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, #9DE8B2 0%, #5DC4B8 40%, #FBE07A 75%, #FBB97A 100%);
      padding: 12px;
      display: grid;
      place-items: center;
      animation: pulseRing 6s ease-in-out infinite;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    .breath-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #161817;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-on-dark);
    }
    .breath-count {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .breath-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-on-dark-muted);
      margin-top: 4px;
    }
    .overlay-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-on-dark);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .overlay-copy {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-on-dark-muted);
      max-width: 280px;
    }

    /* v7.0 Unified 2-Row Action Dock */
    .action-dock {
      background: var(--bg-screen);
      border-radius: 26px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    .dock-row-inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-dock-home {
      height: 50px;
      border: none;
      border-radius: 15px;
      background: var(--accent-mint);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-dock-exit {
      height: 50px;
      border: none;
      border-radius: 15px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-card);
      cursor: pointer;
    }
    .btn-dock-pause {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 15px;
      background: var(--bg-card-subtle);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .toast-feedback {
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-mint);
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="device-frame overlay-viewport">
    <!-- Simulated Guarded App Background -->
    <div class="underlying-feed" aria-hidden="true">
      <div class="feed-header">
        <span>Shorts</span>
        <span>Search · Subscriptions</span>
      </div>
      <div class="feed-skeleton">
        <div class="skel-line" style="width: 48%;"></div>
        <div class="skel-line" style="width: 74%;"></div>
      </div>
    </div>

    <!-- TransparentPauseDimOverlay -->
    <div class="dim-scrim">
      <div class="overlay-top">
        <span class="app-pill">YouTube Shorts</span>
        <span class="budget-pill">12m / 15m budget</span>
      </div>

      <div class="center-prompt">
        <div class="breath-ring">
          <div class="breath-core">
            <span class="breath-count" id="loopCount">14</span>
            <span class="breath-sub">Videos Passed</span>
          </div>
        </div>
        <h1 class="overlay-title">Break the scroll loop</h1>
        <p class="overlay-copy">
          Return to YouTube’s Home tab to keep searching or watching subscriptions, or step out completely.
        </p>
      </div>

      <div>
        <div class="toast-feedback" id="feedbackText"></div>
        <!-- v7.0 2-Row Action Dock -->
        <div class="action-dock">
          <div class="dock-row-inline">
            <button class="btn-dock-home" onclick="handleHome()">Home</button>
            <button class="btn-dock-exit" onclick="handleExit()">Exit</button>
          </div>
          <button class="btn-dock-pause" id="strictPauseBtn" onclick="handleStrictPause()">
            Pause (Strict Mode · 10s)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let strictTimer = null;

    function handleHome() {
      document.getElementById('feedbackText').textContent =
        'Navigating to YouTube Home tab…';
      setTimeout(() => { window.location.href = 'home.html'; }, 850);
    }

    function handleExit() {
      document.getElementById('feedbackText').textContent =
        'Closing Shorts to device Home…';
      setTimeout(() => { window.location.href = 'home.html'; }, 850);
    }

    function handleStrictPause() {
      if (strictTimer) return;
      const btn = document.getElementById('strictPauseBtn');
      let remaining = 10;
      btn.textContent = `Confirming pause in ${remaining}s…`;
      strictTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(strictTimer);
          strictTimer = null;
          btn.textContent = 'Allow once (5 min snooze)';
          document.getElementById('feedbackText').textContent =
            'Strict mode verified · Short-form guard snoozed for 5 min';
        } else {
          btn.textContent = `Confirming pause in ${remaining}s…`;
        }
      }, 1000);
    }
  </script>
</body>
</html>
