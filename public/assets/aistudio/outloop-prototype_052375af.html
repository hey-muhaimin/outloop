function w1(){return `<div class="s" style="padding:0;gap:0;background:#29362E"><div style="position:absolute;inset:0 0 auto 0;height:372px;background:radial-gradient(260px 240px at 50% 58%,rgba(168,179,160,.3),transparent 72%)"></div><svg viewBox="0 0 390 372" width="390" height="372" aria-hidden="true" style="position:absolute;left:0;top:0"><g transform="translate(195 215) scale(2.2) translate(-54 -54)" fill="none" stroke-linecap="round"><path d="${arc(50)}" stroke="#A8B3A0" stroke-opacity=".14" stroke-width="1.2"/><path d="${arc(38)}" stroke="#A8B3A0" stroke-opacity=".24" stroke-width="1.2"/><path d="${arc(25.5)}" stroke="#FAF9F5" stroke-width="7"/></g></svg><div style="position:absolute;left:20px;top:28px;display:flex;align-items:center;gap:8px;color:#FAF9F5">${mark(26,'#FAF9F5')}<span style="font:700 19px Manrope,sans-serif">outloop</span></div><div style="position:absolute;left:0;right:0;top:372px;bottom:0;background:rgba(250,249,245,.82);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border-radius:36px 36px 0 0;padding:28px 20px 24px;display:flex;flex-direction:column;color:#1C231D"><span style="font:600 13px/16px var(--ff);color:#435A4A">Keep your apps. Reclaim your attention.</span><h1 style="margin:8px 0 0;font:700 36px/44px var(--ff);letter-spacing:-.02em">Make room for what matters.</h1><p class="bd" style="margin-top:12px;color:#4A544C">Stay connected to the apps you need without getting pulled into feeds you didn’t come for.</p><div class="ft" style="padding-bottom:0"><button class="btn" style="background:#29362E;color:#FAF9F5" data-a="go:w2">Get started</button><button class="tb" style="color:#435A4A" data-a="skip">Not now</button><p class="lb" style="margin:0;text-align:center;font-size:12px;color:#4A544C">Not now leaves protection off until you turn it on.</p></div></div></div>`}
function w2(){return `<div class="s">${top(1,1)}<h1 class="hl">Here’s exactly what Outloop can see.</h1><p class="bd">Outloop uses Android’s Accessibility Service. Before you turn it on, here’s what that means.</p><div class="card" style="display:flex;flex-direction:column;gap:18px">${it(`<span class="ib">${sv(I.eye)}</span>`,'What it looks at','Technical screen labels in the apps you choose, only to tell whether a Shorts, Reels or Watch feed is open.')}${it(`<span class="ib">${sv(I.xc)}</span>`,'What it doesn’t read','Your messages, your passwords or the videos you watch.')}${it(`<span class="ib">${sv(I.ph)}</span>`,'Where it stays','Detection runs on your phone. Troubleshooting logs are off unless you turn them on.')}</div>${stat('i',I.info,'You’re in control','Turn this off any time in Android Settings.',`<button class="tb" style="height:36px;text-align:left;width:auto;padding:0" data-a="sheet:policy">Read the full privacy policy</button>`)}<div class="ft"><button class="btn" data-a="go:w3">Agree and continue</button><button class="tb" data-a="skip">Not now</button></div></div>`}

function w5(){const p=S.perm,F=(h,b,st,body,ft)=>`<div class="s">${top(4,1)}<h1 class="hl">${h}</h1><p class="bd">${b}</p>${st}${body}<div class="ft">${ft}</div></div>`;

if(p==='checking')return F('Checking your protection','Android says Outloop is switched on. We’re confirming that the service is connected.',stat('i',I.clk,'Checking your protection service','This usually takes a few seconds.','<div role="progressbar" aria-label="Checking" style="height:6px;border-radius:3px;background:rgba(63,88,98,.22);margin-top:10px"><div style="width:45%;height:6px;border-radius:3px;background:var(--int)"></div></div>'),st('Almost done',it(num('✓'),'Permission granted','Outloop is switched on in Accessibility settings.')+it(num('…'),'Confirming the connection','Waiting for Android to report the service as running.')),'<button class="btn" disabled style="opacity:.5">Checking…</button>');
if(p==='problem')return F('Almost there','Outloop is switched on, but Android isn’t reporting an active connection.',stat('w',I.al,'Protection isn’t running yet','Nothing will be interrupted until the connection is restored.'),st('Try this',it(num(1),'Switch Outloop off, then on again','In Accessibility settings.')+it(num(2),'Allow background activity','Some phones stop services to save battery. Check Outloop’s battery setting.')),'<button class="btn" data-a="check">Check again</button><button class="btn b2" data-a="sys">Open Android Settings</button><button class="tb" data-a="cont">Continue without protection</button>');
return F('One small setup step','Outloop uses Android’s Accessibility Service to recognise the feeds you chose and respond the way you picked.',stat('w',I.clk,'Waiting for permission','Outloop will check the connection when you come back.'),st('In Android Settings',it(num(1),'Open Accessibility settings','The button below takes you there.')+it(num(2),'Choose Outloop','Usually under Downloaded apps. Names vary by phone.')+it(num(3),'Turn on Use Outloop','Then tap Allow.')),'<button class="btn" data-a="sys">Open Android Settings</button><button class="tb" data-a="sheet:why">Why does Android ask for this?</button>')}
function sys(){return `<div class="s" style="padding-top:48px;color:var(--ink)"><div class="top"><button class="bk" aria-label="Back" data-a="sysback">${sv(I.back,24)}</button><span class="t17">Accessibility</span></div><p class="eb" style="margin:6px 4px 0">Downloaded apps</p><div class="card" style="padding:4px 16px"><div class="lr" style="padding:0;min-height:64px"><span class="ib">${mark(26,'var(--f9)')}</span><span class="lb2"><b style="font:600 17px var(--ff)">Outloop</b><br><span class="fn">${S.sysOn?'On':'Off'}</span></span></div></div><div class="card"><div class="r"><span class="t17">Use Outloop</span>${sw(S.sysOn,'sysswitch','Use Outloop')}</div><p>Outloop can recognise which short-form feed is open in the apps you chose, and respond with the style you picked.</p></div><p class="fn" style="padding:0 6px">This is a simulation of Android’s settings screen.</p></div>`}
function w6(){const row=(l,v)=>`<div class="rr" style="min-height:0;padding:12px 0;display:block"><span class="lb">${l}</span><b style="display:block;margin-top:2px;font:600 15px/22px var(--ff)">${v}</b></div>`;
return `<div class="s" style="text-align:center"><div style="height:44px"></div><div style="position:relative;width:120px;height:120px;margin:0 auto"><div class="card" style="width:120px;height:120px;border-radius:50%;display:grid;place-items:center;padding:0">${mark(64,'var(--f9)')}</div><span style="position:absolute;right:-2px;bottom:4px;width:36px;height:36px;border-radius:50%;background:#287A59;color:#fff;display:grid;place-items:center">${sv(I.ck,18,3)}</span></div><h1 class="hl" style="font-size:32px;line-height:40px">Outloop is ready.</h1><p class="bd">Protection is on for ${nApps()} apps. You can pause any time from Home.</p><div style="display:flex;justify-content:center"><span class="chip" style="background:var(--oks);color:var(--okt)">${sv(I.ck,16,2.6)}Service connected</span></div><div class="card" style="text-align:left;padding:8px 20px">${row('Apps',APPS.filter(a=>S.apps[a[0]]).map(a=>a[1]).join(', ')||'None yet')}<div style="border-top:1px solid var(--st2)"></div>${row('When a feed opens',MODES[S.style][0])}<div style="border-top:1px solid var(--st2)"></div>${row('Privacy','Detection stays on your device')}</div><div class="ft"><button class="btn" data-a="finish">Go to Home</button></div></div>`}
function home(){const p=pst(),t=S.week[6],l=dl(),v=S.week;

const pc=paused()?`<div class="lr" style="padding:0;min-height:52px"><div style="flex:1"><div class="t17">Taking a little space</div><div class="fn nm" id="pc">${rem()} remaining</div></div><button class="gb" style="flex:none;padding:0 20px" data-a="pause:0">Resume</button></div>`:`<div class="fn" style="margin:8px 0;font-weight:600">Take a little space</div><div class="row" style="gap:8px"><button class="gb" data-a="pause:5">5 min</button><button class="gb" data-a="pause:15">15 min</button><button class="gb" data-a="pause:60">1 hour</button></div>`;

return `<div class="s"><div><span class="eb">${dt()}</span><div class="r"><h1 class="lt">Today</h1><span class="pill"><i class="dt2" style="${p=='active'?'':'background:var(--st4)'}"></i>${PILL[p]}</span></div></div><div class="card" style="padding:18px"><div class="row" style="gap:18px"><div style="position:relative;width:104px;height:104px;flex:none"><svg width="104" height="104" viewBox="0 0 108 108" aria-hidden="true"><path d="${arc(42)}" fill="none" style="stroke:var(--f9)" stroke-width="9" stroke-linecap="round"/></svg><div class="nm" style="position:absolute;inset:0;display:grid;place-items:center;font:700 38px var(--ff)">${t}</div></div><div style="flex:1"><div class="t17">feeds interrupted today</div><div class="fn" style="margin-top:4px">${mins(t*3)} est. time reclaimed</div></div></div><div class="r" style="margin-top:14px;align-items:flex-start">${w}</div></div>${top2}<div class="r" style="margin:0 4px"><span class="sh">Your apps</span><span class="fn">${nApps()} selected</span></div><div class="card" style="padding:0">${APPS.map(a=>arow(a)).join('')}</div>${tabs('home')}</div>`}
const rem=()=>{const s=Math.max(0,Math.ceil((S.pause-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function ins(){const r=S.range,v=S.week,tot=v.reduce((a,b)=>a+b,0),W=S.wapp;
const data=r==='30 days'?[21,25,19,tot]:v,lab=r==='30 days'?['3w ago','2w ago','Last wk','This wk']:dl(),mx=Math.max(1,...data),n=data.length,bw=n==4?60:30,gap=(318-n*bw)/(n-1);
const bars=data.map((x,i)=>`<rect x="${i*(bw+gap)}" y="${110-x/mx*90}" width="${bw}" height="${x/mx*90}" rx="${Math.min(bw/2,15)}" style="fill:var(--f9);opacity:${i==n-1?1:.28}"/><text x="${i*(bw+gap)+bw/2}" y="134" text-anchor="middle" font-size="12" style="fill:var(--sl7);font-family:var(--ff)">${lab[i]}</text>`).join('');

const top3=Object.entries(W).sort((a,b)=>b[1]-a[1])[0];const nm={ig:'Instagram',fb:'Facebook',yt:'YouTube'};
const app=(k,c)=>`<div style="margin-top:12px"><div class="r"><span class="t17" style="font-weight:500">${nm[k]}</span><span class="vl nm">${c}</span></div><div class="cap"><i style="width:${Math.round(c/Math.max(1,top3[1])*100)}%"></i></div></div>`;
const empty=tot===0;
return `<div class="s"><h1 class="lt" style="margin-top:6px">Insights</h1>${seg(['Today','7 days','30 days'],r,'range','Time range')}${empty?`<div class="card" style="text-align:center;padding:40px 20px"><div class="t17">Nothing to interrupt yet.</div><p>Your insights will appear as you use Outloop.</p></div>`:`<div class="card"><div class="t17">${r==='Today'?'A moment before the next scroll.':'Your attention had a little more room.'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:14px">${mt(sum,'feeds interrupted')}${mt(mins(sum*3),'est. time reclaimed')}${mt((sum/days).toFixed(1),'daily average')}${mt(nm[top3[0]],'most interrupted')}</div></div>${r==='Today'?'':`<div class="card"><div class="t17">Feeds interrupted</div><svg viewBox="0 0 318 142" width="100%" role="img" aria-label="Bar chart of feeds interrupted: ${data.join(', ')}" style="display:block;margin-top:10px">${bars}</svg></div>`}${r==='7 days'?`<div class="card" style="padding:16px 20px 20px"><div class="t17">By app</div>${Object.entries(W).sort((a,b)=>b[1]-a[1]).map(e=>app(e[0],e[1])).join('')}</div>`:''}`}${tabs('ins')}</div>`}

const conn=p=='down'||p=='setup'?`<span class="pill" style="height:28px;color:var(--wnt)">${p=='down'?'Disconnected':'Not enabled'}</span>`:`<span class="pill" style="height:28px;color:var(--okt)">${sv(I.ck,14,3)}Connected</span>`;
return `<div class="s" style="gap:12px"><h1 class="lt" style="margin-top:6px">Settings</h1>${g('Protection',`<div class="lr"><span class="lb2">Accessibility service</span>${conn}</div>${lr('Protected apps',`<span class="vl">${nApps()}</span>`,'sheet:apps')}${lr('Default response',`<span class="vl">${MODES[S.style][0]}</span>`,'sheet:style')}`)}${g('Appearance',`<div class="lr" style="padding:8px 16px">${seg(['Light','Dark','System'],S.appear,'appear','Appearance').replace('class="seg"','class="seg" style="flex:1"')}</div><div class="lr"><span class="lb2">Haptic feedback</span>${sw(S.haptic,'hap','Haptic feedback')}</div>`)}${g('Privacy and permissions',lr('How detection works','','sheet:policy')+lr('Privacy policy','','sheet:policy')+`<div class="lr"><span class="lb2">About Outloop</span><span class="vl">2.0</span></div>`)}${g('Data',`<div class="lr" style="justify-content:center"><button class="rb" data-a="sheet:clear" style="justify-content:center;min-height:52px"><span class="lb2" style="flex:none;color:var(--rose)">Clear activity history</span></button></div>`)}${tabs('set')}</div>`}
function sheet(){const s=S.sheet;if(!s)return '';const sh=(t,b,f='')=>`<button class="scrim" data-a="close" aria-label="Close"></button><div class="sheet" role="dialog" aria-label="${t}"><div class="grab"></div><h2 class="t17" style="font-size:20px;margin:0 0 8px">${t}</h2>${b}${f||'<button class="btn b2" style="margin-top:14px" data-a="close">Done</button>'}</div>`;
if(s==='policy')return sh('How Outloop uses Accessibility','<div style="display:flex;flex-direction:column;gap:12px">'+[['Why access is needed','To tell which short-form feed is open in the apps you chose.'],['What is inspected','Technical screen labels, not your messages or passwords.'],['What stays on device','Detection runs on your phone.'],['Diagnostic data','Off by default. If you turn it on, only technical screen IDs are kept locally.'],['How to switch it off','Android Settings › Accessibility › Outloop.']].map(x=>`<div><b style="font:600 15px var(--ff)">${x[0]}</b><div class="fn" style="font-size:14px;line-height:20px">${x[1]}</div></div>`).join('')+'</div>');
if(s==='why')return sh('Why does Android ask?','<p class="bd">Short-form feeds can’t be recognised any other way. Android requires your explicit permission before any app can read which screen is open, and you can withdraw it at any time.</p>');
if(s==='allow')return `<button class="scrim" data-a="deny" aria-label="Close"></button><div class="sheet" role="alertdialog" aria-label="Use Outloop?" style="text-align:center"><h2 class="t17" style="font-size:20px;margin:6px 0 8px">Use Outloop?</h2><p class="bd">Outloop needs to observe which app screen is open so it can respond to the feeds you chose.</p><div class="r" style="margin-top:16px"><button class="btn b2" data-a="deny">Deny</button><button class="btn" data-a="allow">Allow</button></div></div>`;
if(s==='clear')return sh('Clear activity history?','<p class="bd">This removes your interruption counts and insights from this device. It can’t be undone.</p>',`<div class="r" style="margin-top:16px"><button class="btn b2" data-a="close">Cancel</button><button class="btn" style="background:var(--rose);color:#fff" data-a="clear">Clear</button></div>`);
if(s==='style')return sh('Default response',`<div role="radiogroup" style="display:flex;flex-direction:column;gap:8px">${Object.keys(MODES).map(k=>`<button class="opt${S.style==k?' on':''}" role="radio" aria-checked="${S.style==k}" data-a="style:${k}"><span class="rd"></span><span style="flex:1;display:block"><b>${MODES[k][0]}</b><span class="sb">${MODES[k][1]}</span></span></button>`).join('')}</div>`);
if(s==='apps')return sh('Protected apps',`<div class="card" style="padding:0 16px;box-shadow:none">${APPS.map(a=>arow(a)).join('')}</div>`);
if(s==='app'){const a=APPS.find(x=>x[0]===S.sel);return sh(a[1],`<p class="bd" style="margin-bottom:12px">Protects ${a[3]}. Pick how Outloop steps in for this app.</p><div role="radiogroup" style="display:flex;flex-direction:column;gap:8px">${Object.keys(MODES).map(k=>`<button class="opt${S.mode[a[0]]==k?' on':''}" role="radio" aria-checked="${S.mode[a[0]]==k}" data-a="amode:${k}"><span class="rd"></span><span style="flex:1;display:block"><b>${MODES[k][0]}</b><span class="sb">${MODES[k][1]}</span></span></button>`).join('')}</div>`)}
return ''}
function overlay(){const c=S.cur;if(S.scr!=='feed'||!c||!c.block||c.done)return '';return `<div style="position:absolute;inset:0;background:rgba(10,14,11,.45);display:grid;place-items:center;padding:24px"><div class="card" role="alertdialog" aria-label="Take a moment" style="width:100%;text-align:center;background:rgba(250,249,245,.92);color:#1C231D;border-radius:32px;padding:24px"><div style="display:grid;place-items:center">${mark(44,'#29362E')}</div><h2 style="margin:10px 0 4px;font:700 26px/32px var(--ff)">Take a moment.</h2><p style="margin:0 0 18px;font:400 16px/23px var(--ff);color:#4A544C">Is this what you came here for?</p><button class="btn" style="background:#29362E;color:#FAF9F5" data-a="home">Return to my intention</button><button class="tb" style="color:#29362E" data-a="once">Allow once</button><button class="tb" style="color:#4A544C;height:40px" data-a="snz">Snooze for 15 minutes</button></div></div>`}
function panel(){const J=[['launcher','Launcher'],['w1','Welcome'],['w2','Privacy'],['w3','Apps'],['w4','Style'],['w5','Allow access'],['sys','Android settings'],['w6','Ready'],['home','Home'],['ins','Insights'],['set','Settings'],['feed','Demo feed']];
return `<h1>Outloop prototype</h1><p>Tap the Outloop icon on the launcher to begin. With protection on, open Instagram to see the pause screen.</p><h2>Jump to</h2><div class="pbs">${J.map(j=>`<button class="pb" aria-pressed="${S.scr===j[0]||(S.scr==='app'&&j[0]===S.tab)}" data-a="jump:${j[0]}">${j[1]}</button>`).join('')}</div><h2>Phone appearance</h2><div class="pbs">${['Light','Dark','System'].map(x=>`<button class="pb" aria-pressed="${S.appear==x}" data-a="appear:${x}">${x}</button>`).join('')}</div><h2>Simulate</h2><div class="pbs"><button class="pb" aria-pressed="${!S.svc}" data-a="svc">Service disconnected</button><button class="pb" aria-pressed="${S.failNext}" data-a="fail">Next access check fails</button></div><h2>Demo</h2><button class="pb" data-a="reset">Reset prototype</button>`}
function view(){const s=S.scr;return s==='launcher'?launcher():s==='splash'?splash():s==='feed'?feed():s==='w1'?w1():s==='w2'?w2():s==='w3'?w3():s==='w4'?w4():s==='w5'?w5():s==='sys'?sys():s==='w6'?w6():S.tab==='ins'?ins():S.tab==='set'?set():home()}
function render(){$('#ph').className='phone'+(dark()?' dk':'');$('#scr').innerHTML=view();$('#ovl').innerHTML=sheet()+overlay()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');$('#panel').innerHTML=panel()}
function say(t){S.toast=t;clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},2200)}
function openApp(id){if(!S.apps[id]&&pst()==='active'){S.cur={id,block:0};S.scr='feed';return}
const hit=pst()==='active'&&S.apps[id]&&!(S.snooze[id]>Date.now());S.cur={id,block:0,done:0};S.scr='feed';
if(hit){S.week[6]++;S.wapp[id]=(S.wapp[id]||0)+1;const m=S.mode[id];if(m==='gentle')S.cur.block=1;else if(m==='back'){setTimeout(()=>{S.scr='launcher';S.cur=null;say('Outloop took you back');render()},700)}else S.cur.home=1}}
function check(){S.perm='checking';S.scr='w5';render();setTimeout(()=>{if(S.failNext){S.failNext=false;S.perm='problem';S.svc=false}else{S.perm='ok';S.svc=true;S.scr='w6'}render()},1800)}
const BACK={w2:'w1',w3:'w2',w4:'w3',w5:'w4'};
function act(a,v){switch(a){
case 'openapp':S.scr='splash';render();setTimeout(()=>{S.scr=S.onb?'app':'w1';render()},700);return;
case 'open':openApp(v);break;case 'home':S.scr='launcher';S.cur=null;break;case 'go':S.scr=v;break;
case 'back':S.scr=BACK[S.scr]||'w1';break;
case 'skip':S.onb=true;S.scr='app';S.tab='home';break;
case 'tog':S.apps[v]=S.apps[v]?0:1;break;case 'style':S.style=v;Object.keys(S.mode).forEach(k=>S.mode[k]=v);break;
case 'app':S.sel=v;S.sheet='app';break;case 'amode':S.mode[S.sel]=v;break;
case 'sys':S.scr='sys';break;case 'sysswitch':if(S.sysOn)S.sysOn=false;else S.sheet='allow';break;
case 'allow':S.sysOn=true;S.sheet=null;break;case 'deny':S.sheet=null;break;
case 'sysback':if(S.sysOn){check();return}S.scr='w5';S.perm='idle';say('Outloop isn’t switched on yet');break;
case 'check':check();return;case 'cont':S.onb=true;S.scr='app';S.tab='home';break;
case 'finish':S.onb=true;S.scr='app';S.tab='home';break;
case 'fix':S.svc=true;say('Connection restored');break;
case 'tab':S.tab=v;break;case 'prot':S.on=!S.on;break;
case 'pause':S.pause=+v?Date.now()+v*60000:0;break;
case 'range':S.range=v;break;case 'appear':S.appear=v;break;case 'hap':S.haptic=!S.haptic;break;
case 'sheet':S.sheet=v;break;case 'close':S.sheet=null;break;
case 'clear':S.week=S.week.map(()=>0);S.wapp={ig:0,fb:0,yt:0};S.sheet=null;say('Activity history cleared');break;
case 'once':S.cur.done=1;break;case 'snz':S.snooze[S.cur.id]=Date.now()+15*60000;S.cur.done=1;say('Snoozed for 15 minutes');break;
case 'svc':S.svc=!S.svc;break;case 'fail':S.failNext=!S.failNext;break;
case 'reset':{const ap=S.appear;S=S0();S.appear=ap;break}
case 'jump':{if(['home','ins','set'].includes(v)){S.onb=true;S.sysOn=true;S.scr='app';S.tab=v}else if(v==='feed')openApp('ig');else{S.scr=v;if(v==='w6'){S.sysOn=true;S.perm='ok'}}break}
}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const i=b.dataset.a.indexOf(':');act(i<0?b.dataset.a:b.dataset.a.slice(0,i),i<0?'':b.dataset.a.slice(i+1))});
function fit(){const w=innerWidth,n=w<900,s=Math.min(1,(w-(n?24:360))/390,n?9:(innerHeight-48)/844);$('#hold').style.cssText=`width:${390*s}px;height:${844*s}px`;$('#ph').style.transform=`scale(${s})`}
addEventListener('resize',fit);mq.addEventListener('change',render);
setInterval(()=>{if(S.pause&&!paused()){S.pause=0;render()}else if(paused()&&S.scr==='app'&&S.tab==='home'){const e=$('#pc');if(e)e.textContent=rem()+' remaining'}if(S.scr==='launcher'&&new Date().getSeconds()<1)render()},1000);
fit();render();
})();
</script>
</body>
