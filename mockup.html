<script>
'use strict';
const $=s=>document.querySelector(s);
const IC={back:'M15 5l-7 7 7 7',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6z',x:'M12 21a9 9 0 100-18 9 9 0 000 18zM9 9l6 6M15 9l-6 6',ph:'M8 3h8a1 1 0 011 1v16a1 1 0 01-1 1H8a1 1 0 01-1-1V4a1 1 0 011-1zM11 18h2',i:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v5M12 8h.01',ck:'M5 13l4 4L19 7',clk:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2',warn:'M12 4l9 16H3zM12 10v4M12 17h.01',chv:'M9 5l7 7-7 7',home:'M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z',ins:'M5 20V11M12 20V5M19 20v-8',set:'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',acc:'M12 3.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM5 9l7 1 7-1M12 10v4M9 21l3-7 3 7'};
const ic=(n,s=22,w=2)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`;
const arc=R=>{const p=a=>[54+R*Math.cos(a*Math.PI/180),54+R*Math.sin(a*Math.PI/180)].map(v=>v.toFixed(2));const a=p(-27),b=p(-63);return `M${a[0]},${a[1]}A${R},${R} 0 1 1 ${b[0]},${b[1]}`};
const mark=(s,c='var(--f9)')=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="20 20 68 68"><path d="${arc(25.5)}" fill="none" style="stroke:${c}" stroke-width="7" stroke-linecap="round"/></svg>`;
const icon=(k,s)=>{const bg={light:'linear-gradient(160deg,#fff,#E3E0D2)',dark:'linear-gradient(160deg,#42584A,#17201A)',clear:'linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.12))'}[k],rc={light:'#29362E',dark:'#FAF9F5',clear:'#fff'}[k];return `<div class="ico" style="width:${s}px;height:${s}px;background:${bg};${k=='clear'?'border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(18px)':''}"><svg width="${s}" height="${s}" viewBox="0 0 108 108" role="img" aria-label="Outloop icon, ${k}"><path d="${arc(25.5)}" fill="none" stroke="${rc}" stroke-width="7" stroke-linecap="round"/></svg></div>`};
const fresh=()=>({appear:'Light',scr:'welcome',hist:[],setup:0,protect:0,apps:{fb:1,ig:1,yt:1},mode:'Gentle reminder',amode:{},pauseEnd:0,est:3,range:'7 days',sel:-1,week:[3,2,5,4,6,3,4],m30:[24,29,22,27],by7:{ig:12,fb:8,yt:7},by30:{ig:44,fb:31,yt:27},haptic:1,notif:1,detail:'ig',sheet:'',toast:'',fail:0,ov:0});

const seg=(k,o,sel,l)=>`<div class="seg" role="radiogroup" aria-label="${l}">${o.map(x=>`<button role="radio" aria-checked="${x==sel}"${x==sel?' class="a"':''} data-a="seg" data-k="${k}" data-v="${x}">${x}</button>`).join('')}</div>`;

const bk=`<button class="bk" data-a="back" aria-label="Back">${ic('back',24)}</button>`;

 case 'amode':S.amode[S.detail]=v;break;
 case 'pause':S.pauseEnd=Date.now()+v*60000;break;
 case 'resume':S.pauseEnd=0;break;
 case 'detail':S.detail=v;go('detail');break;
 case 'ov':S.ov=1;S.sheet='';break;
 case 'ovc':ovc(v);return;
 case 'sheet':S.sheet=v;break;
 case 'sx':S.sheet='';break;
 case 'clear':clearData();S.sheet='';toast('Activity history cleared.');return;
 case 'sel':S.sel=+v;break;
 case 'perm':case 'chk':startCheck();return;
 case 'skip':S.setup=0;S.protect=0;S.hist=[];S.scr='home';break;
 case 'fin':S.hist=[];S.scr='home';break;
 case 'appoff':S.apps[S.detail]=0;back();toast(APPS[S.detail].n+' is off. You can turn it back on any time.');return;
 case 'toast':toast(v);return;
 case 'jump':jump(v);return;
 case 'reset':S=fresh();break;
 case 'fail':S.fail=S.fail?0:1;break;
 }
 render()}
function overlay(){let h='';
 if(S.ov)h+=`<div class="ovl"><div class="feed"><i></i><i></i><div class="rail"><b></b><b></b><b></b></div></div><div class="c ovc" role="dialog" aria-label="Take a moment"><span class="pill">Simulation, not a real feed</span><div style="margin-top:8px">${mark(44)}</div><h2 class="hl" style="font-size:28px;line-height:34px">Take a moment.</h2><p class="bd">Is this what you came here for?</p><div class="col8">${btn('Return to my intention','ovc','ret')}${btn('Allow once','ovc','once','b2')}${tbn('Snooze for 15 minutes','ovc','snz')}</div></div></div>`;
 if(S.sheet=='clear')h+=`<div class="scrim" data-a="sx"><div class="sheet" data-a="noop" role="dialog" aria-label="Clear activity history"><div class="grab"></div><h2 class="hl" style="font-size:24px;line-height:30px">Clear activity history?</h2><p class="bd">This removes your counts and insights from this device. It can’t be undone.</p>${btn('Clear history','clear','','bd2')}${btn('Cancel','sx','','b2')}</div></div>`;
 if(S.sheet=='resp')h+=`<div class="scrim" data-a="sx"><div class="sheet" data-a="noop" role="dialog" aria-label="Default response"><div class="grab"></div><h2 class="hl" style="font-size:24px;line-height:30px">Default response</h2><div class="col8" role="radiogroup" aria-label="Default response">${MODES.map(([t,p])=>opt(t,p,t==S.mode,'mode')).join('')}</div>${btn('Done','sx')}</div></div>`;
 if(S.toast)h+=`<div class="toast" role="status">${S.toast}</div>`;return h}
function side(){const g=(t,l)=>`<div><h3>${t}</h3><div class="jl">${l.map(([v,n])=>`<button class="jb" data-a="jump" data-v="${v}">${n}</button>`).join('')}</div></div>`;
 return `<div style="display:flex;align-items:center;gap:12px">${icon('light',52)}<div><h2>Outloop</h2><div class="fn">Interactive mockup</div></div></div><p class="fn" style="margin:0">Tap through the phone, or jump to any screen. All numbers are sample data.</p><div><h3>Appearance</h3>${seg('appear',['Light','Dark','System'],S.appear,'Appearance')}</div>${g('Onboarding',[['welcome','Welcome'],['privacy1','Privacy'],['apps','Choose apps'],['style','How it steps in'],['allow','Allow access'],['checking','Checking'],['problem','Needs attention'],['ready','Ready']])}${g('App',[['home','Home'],['insights','Insights'],['settings','Settings'],['detail','App detail'],['manage','Your apps'],['privacy','Privacy'],['diag','Diagnostics']])}${g('States',[['h-setup','Home: setup needed'],['h-off','Home: protection off'],['h-pause','Home: paused'],['i-empty','Insights: empty'],['ov','Pause screen'],['clr','Confirm clear']])}<label class="chk"><input type="checkbox" data-a="fail"${S.fail?' checked':''}> Make the permission check fail</label><div><button class="jb" data-a="reset">Reset demo</button></div><div><h3>App icon</h3><div class="icons">${icon('light',64)}${icon('dark',64)}${icon('clear',64)}</div><div class="cap3"><span>Light</span><span>Dark</span><span>Clear</span></div></div>`}
function render(){
 const dk=S.appear=='Dark'||(S.appear=='System'&&matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.classList.toggle('dk',dk);
 const v=V[S.scr](),o=$('.body'),sc=o&&o.dataset.s==S.scr?o.scrollTop:0;
 $('#scr').innerHTML=v.raw||`${v.top||''}<div class="body${v.tab?' tb':''}" data-s="${S.scr}">${v.body}</div>${v.foot?`<div class="foot">${v.foot}</div>`:''}${v.tab?tabbar(v.tab):''}`;
 const b=$('.body');if(b)b.scrollTop=sc;
 $('#ov').innerHTML=overlay();$('#side').innerHTML=side()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.dataset.a!='noop')act(t.dataset.a,t.dataset.k,t.dataset.v)});
setInterval(()=>{if(!S.pauseEnd)return;if(Date.now()>=S.pauseEnd){S.pauseEnd=0;toast('Protection resumed.')}else{const e=$('#cd');if(e)e.textContent=left()}},1000);
function fit(){const m=innerWidth<=900,aw=m?innerWidth-24:innerWidth-310-44-40,s=m?Math.min(1,(aw-18)/390):Math.min(1,(innerHeight-58)/844,(aw-18)/390);document.documentElement.style.setProperty('--sc',Math.max(.4,s).toFixed(3))}
addEventListener('resize',fit);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
fit();render();
</script></body></html>
