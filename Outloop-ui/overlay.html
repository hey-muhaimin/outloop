<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outloop — Pause Overlay Preview</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    /* Translucent Scrim simulating Accessibility Overlay */
    .overlay-container {
      background: rgba(18, 19, 18, 0.85);
      backdrop-filter: blur(8px);
      position: absolute;
      inset: 0;
      z-index: 100;
      padding: 36px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .pause-guard-card {
      background: var(--bg-hero-dark);
      color: var(--text-on-dark);
      border-radius: 32px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .pg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .strict-pill {
      font-size: 11px;
      font-weight: 700;
      background: rgba(255,255,255,0.1);
      color: var(--text-on-dark);
      padding: 5px 12px;
      border-radius: 99px;
    }
    .timer-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-mint);
    }

    .pg-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .pg-desc {
      font-size: 13px;
      color: var(--text-on-dark-muted);
      line-height: 1.4;
      margin-top: -10px;
    }

    /* Duration Segmented Row */
    .duration-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: rgba(255,255,255,0.06);
      padding: 4px;
      border-radius: 99px;
    }
    .dur-btn {
      background: transparent;
      border: none;
      color: var(--text-on-dark-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .dur-btn.active {
      background: #FFFFFF;
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Action Dock & Buttons */
    .dock-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .dock-btn {
      height: 48px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: var(--text-on-dark);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dock-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
    
    .back-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
      color: var(--text-on-dark-muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="device-frame" style="background: #1C1D1F;">
    <div class="overlay-container">
      <div class="pause-guard-card">
        <div class="pg-top">
          <span class="strict-pill">Strict Mode</span>
          <span class="timer-badge" id="timerBadge">10s wait</span>
        </div>

        <div>
          <h2 class="pg-title">Pause Guard?</h2>
          <p class="pg-desc">Strict mode asks you to wait 10 seconds before taking a break from YouTube Shorts.</p>
        </div>

        <div class="duration-row">
          <button class="dur-btn" onclick="selectDur(5, this)">5 min</button>
          <button class="dur-btn active" onclick="selectDur(15, this)">15 min</button>
          <button class="dur-btn" onclick="selectDur(30, this)">30 min</button>
        </div>

        <button class="btn-mint" id="breakBtn" disabled style="opacity: 0.5;" onclick="alert('Pause break granted!')">
          Pause in 10s
        </button>

        <div class="dock-row">
          <button class="dock-btn" onclick="location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
            <span>Home</span>
          </button>
          <button class="dock-btn" onclick="location.href='home.html'">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            <span>Exit</span>
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 12px;">
        <a href="home.html" class="back-home">← Dismiss and Return to Home</a>
      </div>
    </div>
  </div>

  <script>
    let seconds = 10;
    const btn = document.getElementById('breakBtn');
    const badge = document.getElementById('timerBadge');

    const timer = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        badge.textContent = `${seconds}s wait`;
        btn.textContent = `Pause in ${seconds}s`;
      } else {
        clearInterval(timer);
        badge.textContent = 'Ready';
        btn.textContent = 'Pause for 15 min';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }, 1000);

    function selectDur(mins, el) {
      document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      if (seconds <= 0) {
        btn.textContent = `Pause for ${mins} min`;
      }
    }
  </script>
</body>
</html>
